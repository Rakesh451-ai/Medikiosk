services:
  postgres:
    image: postgres:16-alpine
    container_name: medikiosk_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-medikiosk_db}
      POSTGRES_USER: ${DB_USER:-medikiosk_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-medikiosk_secret}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-medikiosk_user} -d ${DB_NAME:-medikiosk_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medikiosk_redis_prod
    restart: always
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medikiosk_backend_prod
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_demo_journey &&
             gunicorn medikiosk_core.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DJANGO_ENV=prod
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-medikiosk_db}
      - DB_USER=${DB_USER:-medikiosk_user}
      - DB_PASSWORD=${DB_PASSWORD:-medikiosk_secret}
      - DB_HOST=postgres
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,frontend}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medikiosk_celery_prod
    restart: always
    command: celery -A medikiosk_core worker -l info --concurrency=2
    environment:
      - DJANGO_ENV=prod
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-medikiosk_db}
      - DB_USER=${DB_USER:-medikiosk_user}
      - DB_PASSWORD=${DB_PASSWORD:-medikiosk_secret}
      - DB_HOST=postgres
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: medikiosk_frontend_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data_prod:
  redis_data_prod:
  static_volume:
  media_volume:
