services:
  postgres:
    image: postgres:16-alpine
    container_name: medikiosk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-medikiosk_db}
      POSTGRES_USER: ${DB_USER:-medikiosk_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-medikiosk_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-medikiosk_user} -d ${DB_NAME:-medikiosk_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medikiosk_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medikiosk_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_data &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-medikiosk-core-secret-key-2026}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-medikiosk_db}
      - DB_USER=${DB_USER:-medikiosk_user}
      - DB_PASSWORD=${DB_PASSWORD:-medikiosk_secret}
      - DB_HOST=postgres
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CORS_ALLOW_ALL=True
      - USE_SQLITE=False
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medikiosk_celery
    restart: unless-stopped
    command: celery -A medikiosk_core worker -l info
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-medikiosk-core-secret-key-2026}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-medikiosk_db}
      - DB_USER=${DB_USER:-medikiosk_user}
      - DB_PASSWORD=${DB_PASSWORD:-medikiosk_secret}
      - DB_HOST=postgres
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - USE_SQLITE=False
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medikiosk_frontend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
